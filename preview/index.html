<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2F5D2E">
<title>Tales of Tea | Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --green:#2F5D2E; --green-d:#244A24; --leaf:#7FB83F; --brown:#7A4A28; --ink:#3E2615;
  --amber:#E8A33D; --cream:#F6E8C8; --bg:#FBFCF8; --ok:#2F8F4E; --bad:#B3412E;
  --card:#fff; --line:#E9E2D0; --muted:#7b6a58; --tint:#EAF3E3;
  --radius:18px; --shadow:0 6px 24px rgba(62,38,21,.10); --nav-h:64px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{font-family:'Noto Sans Bengali',system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom))}
h1,h2,h3{font-family:'Playfair Display','Noto Sans Bengali',serif;line-height:1.25}
a{color:inherit}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
svg{display:block}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
.sec{padding:44px 0}
.sec.alt{background:#fff}
.eyebrow{color:var(--brown);font-weight:700;font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;margin-bottom:6px}
.sec h2{font-size:1.65rem;color:var(--green);margin-bottom:8px}
.sec .sub{color:var(--muted);margin-bottom:24px;max-width:640px}
.center{text-align:center}.center .sub{margin-left:auto;margin-right:auto}

/* header */
.top{position:sticky;top:0;z-index:30;background:rgba(251,252,248,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.top .wrap{display:flex;align-items:center;gap:12px;height:64px}
.brand img{height:50px;width:auto;mix-blend-mode:multiply;display:block}
.nav{display:none;margin-left:auto;gap:4px}
.nav a{padding:8px 15px;border-radius:99px;text-decoration:none;font-weight:500}
.nav a:hover{background:var(--cream)}
.nav a.on{background:var(--green);color:#fff}
.tools{margin-left:auto;display:flex;gap:8px;align-items:center}
.lang{border:1px solid var(--line);border-radius:99px;padding:6px 12px;font-size:.85rem;background:#fff}
.cartbtn{text-decoration:none;display:none;position:relative;background:var(--green);color:#fff;padding:9px 18px;border-radius:99px;font-weight:700}
.badge{position:absolute;top:-6px;right:-4px;background:var(--amber);color:var(--ink);border-radius:99px;min-width:20px;height:20px;font-size:.75rem;display:none;place-items:center;padding:0 5px;font-weight:700}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 24px;border-radius:99px;font-weight:700;text-decoration:none;min-height:48px;transition:transform .15s,background .2s}
.btn:active{transform:scale(.98)}
.btn.amber{background:var(--amber);color:var(--ink)}.btn.amber:hover{background:#f0b153}
.btn.green{background:var(--green);color:#fff}.btn.green:hover{background:var(--green-d)}
.btn.ghost{border:1.5px solid rgba(255,255,255,.75);color:#fff}
.btn.line{border:1.5px solid var(--green);color:var(--green)}
.btn.block{width:100%}

/* hero */
.hero{background:radial-gradient(circle at 80% 20%,#4f8f3c 0,transparent 45%),linear-gradient(135deg,var(--green-d),var(--green) 60%,#3d7a3a);color:#fff;border-radius:0 0 32px 32px;overflow:hidden;position:relative}
.hero .wrap{display:grid;gap:26px;padding-top:36px;padding-bottom:44px}
.hero h1{font-size:2.1rem}
.hero h1 em{font-style:normal;color:var(--amber)}
.hero p{opacity:.92;max-width:540px;margin:12px 0 18px}
.hero .cta{display:flex;gap:10px;flex-wrap:wrap}
.hero .stats{display:flex;gap:22px;margin-top:26px;flex-wrap:wrap}
.hero .stats b{display:block;font-size:1.4rem;color:var(--amber);font-family:'Playfair Display',serif}
.hero .stats span{font-size:.82rem;opacity:.85}
.hero .art{display:grid;place-items:center;position:relative}
.hero .disc{width:230px;height:230px;border-radius:50%;background:rgba(255,255,255,.1);display:grid;place-items:center}
.float{position:absolute;animation:fl 5s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-10px) rotate(6deg)}}
@keyframes steam{0%{opacity:0;transform:translateY(8px)}50%{opacity:.9}100%{opacity:0;transform:translateY(-14px)}}
.st{animation:steam 3s infinite}.st:nth-child(2){animation-delay:.8s}.st:nth-child(3){animation-delay:1.6s}

/* strip */
.strip{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:-22px;position:relative;z-index:2}
.strip div{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;gap:10px;align-items:center;box-shadow:var(--shadow);font-size:.86rem;font-weight:500}
.strip i{font-style:normal;font-size:1.4rem}

/* cards */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;transition:transform .2s;text-decoration:none}
.card:hover{transform:translateY(-3px)}
.thumb{aspect-ratio:1/.85;display:grid;place-items:center;position:relative}
.tag{position:absolute;top:10px;left:10px;background:#fff;color:var(--green);font-size:.72rem;font-weight:700;padding:3px 10px;border-radius:99px}
.card .body{padding:12px 12px 14px;display:flex;flex-direction:column;gap:3px;flex:1}
.card h3{font-size:1rem;font-family:'Noto Sans Bengali',sans-serif;font-weight:700}
.card .grade{font-size:.8rem;color:var(--muted)}
.stars{color:var(--amber);font-size:.85rem;letter-spacing:1px}
.stars small{color:var(--muted);letter-spacing:0;margin-left:4px}
.price{margin-top:auto;font-weight:700;color:var(--brown);padding-top:4px}
.price small{font-weight:400;color:var(--muted)}
.qadd{margin-top:8px;background:var(--cream);color:var(--green);font-weight:700;border-radius:12px;padding:10px;min-height:44px;width:100%}
.qadd:hover{background:var(--amber)}

/* split blocks */
.split{display:grid;gap:22px;align-items:center}
.storyblock{background:var(--brown);color:#fff;border-radius:28px;overflow:hidden}
.storyblock .txt{padding:28px 22px}
.storyblock h2{color:#fff}
.storyblock p{opacity:.92;margin-bottom:14px}
.storyblock .art{background:linear-gradient(145deg,#8A4B1F,#C98B4E);min-height:220px;display:grid;place-items:center}
.cards3{display:grid;gap:12px}
.feat{background:var(--cream);border-radius:var(--radius);padding:20px}
.feat i{font-style:normal;font-size:1.8rem}
.feat h3{font-family:'Noto Sans Bengali',sans-serif;color:var(--green);margin:6px 0 4px;font-size:1.05rem}
.steps{display:grid;gap:12px}
.step{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:16px;display:flex;gap:14px;align-items:flex-start}
.step b.n{flex:none;width:36px;height:36px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center}
.quote{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.quote p{margin:8px 0 12px}.quote b{color:var(--green)}
.band{background:linear-gradient(120deg,var(--amber),#f2c066);border-radius:28px;padding:30px 22px;text-align:center}
.band h2{color:var(--ink)}
.fbbtn{display:inline-flex;gap:8px;align-items:center;background:#1877F2;color:#fff;border-radius:99px;padding:12px 22px;font-weight:700;text-decoration:none}

/* shop */
.pagehead{background:var(--cream);padding:28px 0}
.pagehead h1{color:var(--green);font-size:1.8rem}
.filters{display:flex;gap:8px;overflow-x:auto;padding:4px 0 14px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.fchip{flex:none;border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:8px 16px;font-weight:500}
.fchip.on{background:var(--green);color:#fff;border-color:var(--green)}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
select{padding:9px 12px;border:1.5px solid var(--line);border-radius:12px;background:#fff;font:inherit;color:var(--ink)}

/* product */
.crumbs{font-size:.85rem;color:var(--muted);padding:14px 0}
.crumbs a{text-decoration:none}.crumbs a:hover{color:var(--green)}
.pdp{display:grid;gap:24px}
.pdp .big{border-radius:26px;overflow:hidden;aspect-ratio:1/.9;display:grid;place-items:center;position:relative}
.pdp h1{font-size:1.8rem;color:var(--green)}
.pdp .pr{font-size:1.9rem;font-weight:700;color:var(--brown);margin:8px 0}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.pill{background:var(--tint);color:var(--green);font-size:.8rem;font-weight:700;padding:4px 12px;border-radius:99px}
.pill.b{background:var(--cream);color:var(--brown)}
.weights{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:10px 0 14px}
.weights button{border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;text-align:left;background:#fff}
.weights button.on{border-color:var(--green);background:var(--tint)}
.weights b{display:block}.weights small{color:var(--muted)}
.qrow{display:flex;gap:12px;align-items:center;margin-bottom:14px}
.qty{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:99px;padding:4px;background:#fff}
.qty button{width:36px;height:36px;border-radius:50%;background:var(--cream);font-weight:700;color:var(--green)}
.qty b{min-width:24px;text-align:center}
.acts{display:grid;gap:10px}
.tabs2{margin-top:26px}
.tabbar{display:flex;gap:6px;border-bottom:1.5px solid var(--line);overflow-x:auto}
.tabbar button{padding:10px 16px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1.5px;white-space:nowrap}
.tabbar button.on{color:var(--green);border-color:var(--green)}
.tabpane{padding:16px 0}
.tabpane ul{padding-left:20px}
.buybar{position:fixed;left:0;right:0;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom));z-index:35;background:#fff;border-top:1px solid var(--line);padding:10px 14px;display:flex;align-items:center;gap:12px;box-shadow:0 -6px 20px rgba(62,38,21,.08)}
.buybar .p{font-weight:700;color:var(--brown);font-size:1.1rem;flex:none}
.buybar .btn{flex:1}

/* cart / checkout */
.two{display:grid;gap:18px}
.panel{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.panel h3{margin-bottom:12px;color:var(--green);font-family:'Noto Sans Bengali',sans-serif}
.cl{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.cl .dot{width:52px;height:52px;border-radius:14px;flex:none;overflow:hidden}
.cl .nm{flex:1;font-weight:500;font-size:.94rem}.cl .nm small{display:block;color:var(--muted)}
.cl .x{color:var(--bad);font-size:.8rem}
.row{display:flex;justify-content:space-between;gap:10px;padding:6px 0}
.row.total{border-top:1.5px dashed var(--line);margin-top:6px;padding-top:12px;font-weight:700;font-size:1.15rem;color:var(--brown)}
label{display:block;font-weight:500;margin:10px 0 4px;font-size:.92rem}
input,textarea{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;font:inherit;background:var(--bg);color:var(--ink)}
input:focus,textarea:focus{outline:0;border-color:var(--leaf);box-shadow:0 0 0 3px rgba(127,184,63,.22)}
.pay{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.pay button{border:1.5px solid var(--line);border-radius:12px;padding:10px 4px;background:#fff;font-weight:700;min-height:46px}
.pay button.on{border-color:var(--green);background:var(--tint);color:var(--green)}
.hint{background:#FFF7E6;border:1px dashed var(--amber);padding:10px 12px;border-radius:12px;font-size:.86rem;margin-top:10px}
.empty{text-align:center;padding:40px 10px;color:var(--muted)}
.empty .big{font-size:3rem}
.ok{text-align:center;padding:30px 10px}
.ok .tick{width:76px;height:76px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;font-size:2.4rem;margin:0 auto 14px}
.oid{display:inline-block;background:var(--cream);padding:6px 16px;border-radius:99px;font-weight:700;color:var(--brown);margin:8px 0 16px}

/* story */
.sbanner{background:linear-gradient(135deg,var(--brown),#8A4B1F);color:#fff;padding:46px 0;border-radius:0 0 32px 32px}
.sbanner h1{font-size:2rem}.sbanner p{opacity:.92;max-width:620px;margin-top:10px}
.tl{display:grid;gap:16px;position:relative}
.tl .it{background:#fff;border:1px solid var(--line);border-left:5px solid var(--leaf);border-radius:var(--radius);padding:18px}
.tl .it b{color:var(--green)}
.note{font-size:.8rem;color:var(--muted);margin-top:12px}

/* contact/faq */
.faq details{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px}
.faq summary{font-weight:700;cursor:pointer;color:var(--green)}
.faq p{margin-top:8px;color:var(--muted)}
.ci{display:flex;gap:12px;align-items:center;padding:10px 0}
.ci i{font-style:normal;width:42px;height:42px;border-radius:12px;background:var(--cream);display:grid;place-items:center;font-size:1.2rem}

/* footer */
footer{background:var(--ink);color:#e8dcc6;padding:34px 0;margin-top:30px}
footer .wrap{display:grid;gap:18px}
footer a{color:var(--amber);text-decoration:none;display:block;padding:2px 0}
footer b{color:#fff}

/* mobile tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -6px 20px rgba(62,38,21,.08)}
.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 7px;font-size:.72rem;color:var(--muted);text-decoration:none;position:relative;min-height:var(--nav-h)}
.tabs a.on{color:var(--green);font-weight:700}
.tabs svg{width:24px;height:24px}
.tabs .badge{top:3px;right:calc(50% - 24px)}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 80px);transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;z-index:90;opacity:0;transition:.25s;pointer-events:none;font-size:.9rem;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.fade{animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

@media (min-width:860px){
  body{padding-bottom:0}
  .tabs,.buybar{display:none!important}
  .nav{display:flex}.tools{margin-left:10px}.cartbtn{display:inline-block}
  .sec{padding:70px 0}.sec h2{font-size:2.1rem}
  .hero .wrap{grid-template-columns:1.15fr .85fr;align-items:center;padding-top:70px;padding-bottom:90px}
  .hero h1{font-size:3.2rem}
  .hero .disc{width:340px;height:340px}
  .strip{grid-template-columns:repeat(4,1fr)}
  .grid{grid-template-columns:repeat(4,1fr);gap:20px}
  .grid.g3{grid-template-columns:repeat(3,1fr)}
  .split{grid-template-columns:1fr 1fr}
  .storyblock{display:grid;grid-template-columns:1fr 1fr}
  .storyblock .txt{padding:54px}
  .cards3{grid-template-columns:repeat(3,1fr)}
  .steps{grid-template-columns:repeat(3,1fr)}
  .pdp{grid-template-columns:1.05fr 1fr;gap:44px;align-items:start}
  .pdp h1{font-size:2.4rem}
  .acts{grid-template-columns:1fr 1fr}
  .two{grid-template-columns:1.1fr .9fr;align-items:start}
  .tl{grid-template-columns:repeat(2,1fr)}
  footer .wrap{grid-template-columns:2fr 1fr 1fr 1fr}
  .toast{bottom:30px}
  .sbanner h1{font-size:3rem}
  .pagehead h1{font-size:2.4rem}
  .cols2{display:grid;grid-template-columns:1fr 1fr;gap:30px}
}
</style>
</head>

  d:{bn:'সিলেটের পাহাড়ি বাগানের কচি পাতা। গাঢ় লিকার, হালকা মিষ্টি সুবাস। দুধ ছাড়া বা দুধ-চা দুইভাবেই দারুণ।',en:'Young leaves from Sylhet hill gardens. Bright liquor with a light sweet aroma. Great with or without milk.'},

  n:{bn:'সিটিসি ডাস্ট চা',en:'CTC Dust Tea'},g:{bn:'কড়া, দুধ-চা',en:'Strong, milk tea'},
  d:{bn:'রোজকার দুধ-চায়ের জন্য কড়া ও ঘন লিকার। দ্রুত রং ছাড়ে, দামে সাশ্রয়ী।',en:'Strong, thick liquor made for everyday milk tea. Quick colour, great value.'},
  notes:{bn:['কড়া','ঘন লিকার','দুধ-চায়ের জন্য'],en:['Strong','Thick liquor','For milk tea']},brew:{t:'100°C',m:'2-3'}},

const stars=(r,c)=>`<div class="stars">${'★'.repeat(Math.round(r))}${'☆'.repeat(5-Math.round(r))}<small>${r} (${c})</small></div>`;

/* ---------- art ---------- */
function leafSvg(c,s=64){return `<svg width="${s}" height="${s}" viewBox="0 0 64 64" fill="none"><path d="M10 54C8 28 28 8 56 8c0 28-18 48-46 46z" fill="#fff" opacity=".92"/><path d="M12 52C26 38 38 26 52 12" stroke="${c}" stroke-width="3" stroke-linecap="round"/></svg>`}
function artBox(t,big){
 const s=big?110:64;
 return `<div style="position:absolute;inset:0;background:linear-gradient(145deg,${t.c[0]},${t.c[1]})"></div>
 <div style="position:relative;display:grid;place-items:center">${leafSvg(t.c[0],s)}</div>
 ${big?`<div class="float" style="top:12%;left:10%;opacity:.7">${leafSvg(t.c[0],38)}</div><div class="float" style="bottom:12%;right:10%;animation-delay:1.4s;opacity:.7">${leafSvg(t.c[0],46)}</div>`:''}`;
}
const cup=`<svg width="170" height="170" viewBox="0 0 120 120" fill="none"><g stroke="#F6E8C8" stroke-width="5" stroke-linecap="round"><path class="st" d="M40 24c-6 8 6 12 0 22"/><path class="st" d="M58 18c-6 8 6 12 0 22"/><path class="st" d="M76 24c-6 8 6 12 0 22"/></g><path d="M24 56h72v10c0 20-14 34-36 34S24 86 24 66V56z" fill="#7A4A28"/><ellipse cx="60" cy="56" rx="36" ry="8" fill="#E8A33D"/><path d="M96 62c14-2 18 14 2 20" stroke="#7A4A28" stroke-width="7" stroke-linecap="round"/><path d="M18 104c-4-14 8-22 20-18-4 10-10 16-20 18z" fill="#7FB83F"/></svg>`;

/* ---------- views ---------- */
function card(t){
 const tag=t.tag?`<span class="tag">${{best:{bn:'সেরা',en:'Best'},new:{bn:'নতুন',en:'New'}}[t.tag][lang]}</span>`:'';
 return `<a class="card" href="#/product/${t.id}"><div class="thumb">${artBox(t)}${tag}</div>
 <div class="body"><h3>${t.n[lang]}</h3><div class="grade">${t.g[lang]}</div>${stars(t.r,t.rc)}
 <div class="price"><small>${T('from')}</small> ${tk(price(t,W[0]))}</div>
 <button class="qadd" data-q="${t.id}">+ ${T('add')}</button></div></a>`;
}
function vHome(){
 const feat=TEAS.filter(t=>[1,4,3,6].includes(t.id));
 return `<div class="fade">
 <section class="hero"><div class="wrap">
  <div><h1>${T('hero_t')}</h1><p>${T('hero_p')}</p>
   <div class="cta"><a class="btn amber" href="#/shop">${T('shop_now')}</a><a class="btn ghost" href="#/story">${T('read_story')}</a></div>
   <div class="stats"><div><b>8</b><span>${T('s_var')}</span></div><div><b>4</b><span>${T('s_w')}</span></div><div><b>COD</b><span>${T('s_cod')}</span></div></div></div>
  <div class="art"><div class="disc">${cup}</div>
   <div class="float" style="top:2%;right:8%">${leafSvg('#2F5D2E',54)}</div><div class="float" style="bottom:4%;left:6%;animation-delay:1.8s">${leafSvg('#2F5D2E',40)}</div></div>
 </div></section>
 <div class="wrap"><div class="strip"><div><i>🍃</i>${T('t1')}</div><div><i>💵</i>${T('t2')}</div><div><i>📱</i>${T('t3')}</div><div><i>🚚</i>${T('t4')}</div></div></div>
 <section class="sec"><div class="wrap"><div class="center"><div class="eyebrow">${T('feat_e')}</div><h2>${T('feat_t')}</h2><p class="sub">${T('feat_s')}</p></div>
  <div class="grid">${feat.map(card).join('')}</div>
  <div class="center" style="margin-top:24px"><a class="btn line" href="#/shop">${T('all_teas')}</a></div></div></section>
 <section class="sec"><div class="wrap"><div class="storyblock">
  <div class="txt"><div class="eyebrow" style="color:var(--amber)">${T('st_e')}</div><h2>${T('st_t')}</h2><p>${T('st_p1')}</p><p>${T('st_p2')}</p><a class="btn amber" href="#/story">${T('read_story')}</a></div>
  <div class="art">${cup}</div></div></div></section>
 <section class="sec alt"><div class="wrap"><div class="center"><div class="eyebrow">${T('why_e')}</div><h2>${T('why_t')}</h2></div><br>
  <div class="cards3"><div class="feat"><i>🌱</i><h3>${T('w1t')}</h3><p>${T('w1d')}</p></div><div class="feat"><i>⚖️</i><h3>${T('w2t')}</h3><p>${T('w2d')}</p></div><div class="feat"><i>⚡</i><h3>${T('w3t')}</h3><p>${T('w3d')}</p></div></div></div></section>
 <section class="sec"><div class="wrap"><div class="center"><div class="eyebrow">${T('how_e')}</div><h2>${T('how_t')}</h2></div><br>
  <div class="steps"><div class="step"><b class="n">1</b><div><b>${T('s1t')}</b><div>${T('s1d')}</div></div></div><div class="step"><b class="n">2</b><div><b>${T('s2t')}</b><div>${T('s2d')}</div></div></div><div class="step"><b class="n">3</b><div><b>${T('s3t')}</b><div>${T('s3d')}</div></div></div></div></div></section>
 <section class="sec alt"><div class="wrap"><div class="center"><div class="eyebrow">${T('rev_e')}</div><h2>${T('rev_t')}</h2></div><br>
  <div class="cards3">${REVIEWS.map(r=>`<div class="quote"><div class="stars">★★★★★</div><p>“${r.t[lang]}”</p><b>${r.n[lang]}</b> <small style="color:var(--muted)">· ${r.c[lang]}</small></div>`).join('')}</div>
  <p class="note center">${T('sample')}</p></div></section>
 <section class="sec"><div class="wrap"><div class="band"><h2>${T('band_t')}</h2><p style="margin:6px 0 16px">${T('band_p')}</p><a class="fbbtn" href="#">f &nbsp;Facebook</a></div></div></section>
 </div>`;
}
function vShop(){
 let list=TEAS.filter(t=>shopType==='all'||t.type===shopType);
 if(shopSort==='lo')list.sort((a,b)=>a.base-b.base);
 if(shopSort==='hi')list.sort((a,b)=>b.base-a.base);
 if(shopSort==='rate')list.sort((a,b)=>b.r-a.r);
 const ty=['all','black','green','herbal','blend'];
 return `<div class="fade"><div class="pagehead"><div class="wrap"><h1>${T('shop_t')}</h1><p style="color:var(--muted)">${T('shop_s')}</p></div></div>
 <section class="sec" style="padding-top:22px"><div class="wrap">
 <div class="filters">${ty.map(x=>`<button class="fchip ${shopType===x?'on':''}" data-ty="${x}">${T('f_'+x)}</button>`).join('')}</div>
 <div class="toolbar"><span style="color:var(--muted)">${list.length} ${T('items')}</span>
  <label style="margin:0;display:flex;gap:8px;align-items:center">${T('sort')} <select id="sortSel"><option value="def">${T('s_def')}</option><option value="lo">${T('s_lo')}</option><option value="hi">${T('s_hi')}</option><option value="rate">${T('s_rate')}</option></select></label></div>
 <div class="grid">${list.map(card).join('')}</div></div></section></div>`;
}
function vProduct(id){
 const t=find(id);if(!t)return vShop();
 const w=W[pdp.wi];const rel=TEAS.filter(x=>x.id!==t.id&&(x.type===t.type||true)).slice(0,4);
 const tabs={d:`<p>${t.d[lang]}</p><div class="meta" style="margin-top:12px">${t.notes[lang].map(n=>`<span class="pill b">${n}</span>`).join('')}</div>`,
  b:`<ul><li>${T('b1')}: <b>${t.brew.t}</b></li><li>${T('b2')}</li><li><b>${t.brew.m}</b> ${T('b3')}</li><li>${T('b4')}</li></ul>`,
  s:`<ul><li>${T('dl1')}</li><li>${T('dl2')}</li><li>${T('dl3')}</li></ul>`};
 return `<div class="fade"><div class="wrap"><div class="crumbs"><a href="#/">${T('nav_home')}</a> / <a href="#/shop">${T('nav_shop')}</a> / ${t.n[lang]}</div>
 <div class="pdp"><div class="big">${artBox(t,true)}</div>
 <div><h1>${t.n[lang]}</h1><div style="color:var(--muted)">${t.g[lang]}</div>${stars(t.r,t.rc)}
  <div class="pr" id="pdpPrice">${tk(price(t,w)*pdp.q)}</div>
  <div class="meta"><span class="pill">${t.type==='black'?T('f_black'):t.type==='green'?T('f_green'):t.type==='herbal'?T('f_herbal'):T('f_blend')}</span>${t.notes[lang].slice(0,2).map(n=>`<span class="pill b">${n}</span>`).join('')}</div>
  <p style="margin-bottom:14px">${t.d[lang]}</p>
  <b>${T('w_pick')}</b>
  <div class="weights" id="wts">${W.map((x,i)=>`<button data-w="${i}" class="${i===pdp.wi?'on':''}"><b>${x.l}</b><small>${tk(price(t,x))}</small></button>`).join('')}</div>
  <div class="qrow"><b>${T('qty')}</b><div class="qty"><button id="qm">-</button><b id="qv">${pdp.q}</b><button id="qp">+</button></div></div>
  <div class="acts"><button class="btn green" id="addBtn">${T('add')}</button><button class="btn amber" id="buyBtn">${T('buy')}</button></div>
 </div></div>
 <div class="tabs2"><div class="tabbar">${[['d','tb_d'],['b','tb_b'],['s','tb_s']].map(([k,l])=>`<button data-tab="${k}" class="${pdp.tab===k?'on':''}">${T(l)}</button>`).join('')}</div><div class="tabpane">${tabs[pdp.tab]}</div></div>
 </div>
 <section class="sec alt" style="margin-top:20px"><div class="wrap"><h2>${T('related')}</h2><div class="grid">${rel.map(card).join('')}</div></div></section>
 <div class="buybar"><span class="p" id="bbP">${tk(price(t,w)*pdp.q)}</span><button class="btn green" id="addBtn2">${T('add')}</button></div></div>`;
}
function totals(){const sub=cart.reduce((a,c)=>a+price(find(c.id),W[c.wi])*c.q,0);return{sub,del:cart.length?DEL:0,tot:sub+(cart.length?DEL:0)}}
function vCart(){
 if(!cart.length)return `<div class="fade"><div class="wrap"><div class="empty"><div class="big">🍵</div><h2 style="color:var(--green)">${T('empty')}</h2><p>${T('empty_s')}</p><br><a class="btn green" href="#/shop">${T('shop_now')}</a></div></div></div>`;
 const tt=totals();
 return `<div class="fade"><div class="pagehead"><div class="wrap"><h1>${T('cart_t')}</h1></div></div>
 <section class="sec" style="padding-top:22px"><div class="wrap two">
 <div class="panel"><h3>${T('cart')}</h3>${cart.map((c,i)=>{const t=find(c.id);return `<div class="cl"><div class="dot" style="position:relative"><div style="position:absolute;inset:0;background:linear-gradient(145deg,${t.c[0]},${t.c[1]})"></div></div>
  <div class="nm"><a href="#/product/${t.id}" style="text-decoration:none">${t.n[lang]}</a><small>${W[c.wi].l} · ${tk(price(t,W[c.wi]))}</small><button class="x" data-rm="${i}">${T('remove')}</button></div>
  <div class="qty"><button data-d="-1" data-i="${i}">-</button><b>${c.q}</b><button data-d="1" data-i="${i}">+</button></div></div>`}).join('')}
  <div class="row"><span>${T('sub')}</span><span>${tk(tt.sub)}</span></div><div class="row"><span>${T('del')}</span><span>${tk(tt.del)}</span></div><div class="row total"><span>${T('tot')}</span><span>${tk(tt.tot)}</span></div></div>
 <form class="panel" id="form"><h3>${T('you')}</h3>
  <label>${T('f_name')}</label><input required id="fn" autocomplete="name">
  <label>${T('f_phone')}</label><input required id="fp" inputmode="numeric" pattern="01[3-9][0-9]{8}" placeholder="01712345678" autocomplete="tel">
  <label>${T('f_addr')}</label><textarea required id="fa" rows="3"></textarea>
  <label>${T('f_pay')}</label>
  <div class="pay" id="pay"><button type="button" data-m="cod" class="${pm==='cod'?'on':''}">COD</button><button type="button" data-m="bkash" class="${pm==='bkash'?'on':''}">bKash</button><button type="button" data-m="nagad" class="${pm==='nagad'?'on':''}">Nagad</button></div>
  <div id="trxBox" style="display:${pm==='cod'?'none':'block'}"><div class="hint">${T('send_to')} <b>01XXX-XXXXXX</b> (${T('sample_no')}) · <b>${tk(tt.tot)}</b></div>
   <label>${T('f_sender')}</label><input id="fs" inputmode="numeric" pattern="01[3-9][0-9]{8}">
   <label>${T('f_trx')}</label><input id="ft" pattern="[A-Za-z0-9]{8,12}" placeholder="8N7A6D5EE"></div>
  <button class="btn green block" style="margin-top:16px">${T('confirm')} · ${tk(tt.tot)}</button></form>
 </div></section></div>`;
}
function vSuccess(id){
 let o=null;try{o=JSON.parse(localStorage.getItem('tot_last')||'null')}catch(e){}
 return `<div class="fade"><div class="wrap"><div class="ok"><div class="tick">✓</div><h2 style="color:var(--green)">${T('ok_t')}</h2><p>${T('ok_p')}</p>
 <div class="oid">${T('oid')}: ${id}</div>${o?`<div class="panel" style="max-width:460px;margin:0 auto 16px;text-align:left">${o.items.map(i=>`<div class="row"><span>${i}</span></div>`).join('')}<div class="row total"><span>${T('tot')}</span><span>${tk(o.tot)}</span></div></div>`:''}
 <p class="note">${T('ok_note')}</p><br><a class="btn green" href="#/">${T('home_btn')}</a></div></div></div>`;
}
function vStory(){
 return `<div class="fade"><div class="sbanner"><div class="wrap"><div class="eyebrow" style="color:var(--amber)">Tales of Tea</div><h1>${T('sb_t')}</h1><p>${T('sb_p')}</p></div></div>
 <section class="sec"><div class="wrap"><div class="tl">${[1,2,3,4].map(n=>`<div class="it"><b>${T('tl'+n+'t')}</b><p>${T('tl'+n+'d')}</p></div>`).join('')}</div></div></section>
 <section class="sec alt"><div class="wrap"><div class="center"><h2>${T('val_t')}</h2></div><br><div class="cards3">
  <div class="feat"><i>🤝</i><h3>${T('v1t')}</h3><p>${T('v1d')}</p></div><div class="feat"><i>🍃</i><h3>${T('v2t')}</h3><p>${T('v2d')}</p></div><div class="feat"><i>🔍</i><h3>${T('v3t')}</h3><p>${T('v3d')}</p></div></div>
  <p class="note center" style="margin-top:20px">${T('fnote')}</p></div></section>
 <section class="sec"><div class="wrap center"><a class="btn green" href="#/shop">${T('shop_now')}</a></div></section></div>`;
}
function vContact(){
 return `<div class="fade"><div class="pagehead"><div class="wrap"><h1>${T('ct_t')}</h1><p style="color:var(--muted)">${T('ct_p')}</p></div></div>
 <section class="sec" style="padding-top:26px"><div class="wrap cols2">
  <div><div class="ci"><i>📞</i><div><b>${T('ph')}</b><br>01XXX-XXXXXX</div></div><div class="ci"><i>💬</i><div><b>${T('fb')}</b><br>facebook.com/talesoftea</div></div><div class="ci"><i>📍</i><div><b>${T('ad')}</b><br>${T('ad_v')}</div></div>
   <form class="panel" id="cform" style="margin-top:14px"><label>${T('f_name')}</label><input required><label>${T('msg')}</label><textarea required rows="4"></textarea><button class="btn green" style="margin-top:12px">${T('send')}</button></form></div>
  <div class="faq"><h2 style="color:var(--green);margin:0 0 14px">${T('faq_t')}</h2>${[1,2,3].map(n=>`<details><summary>${T('q'+n)}</summary><p>${T('a'+n)}</p></details>`).join('')}</div>
 </div></section></div>`;
}

/* ---------- router ---------- */
function route(){
 const h=(location.hash||'#/').slice(2).split('/');const r=h[0]||'home';
 let html,active=r;
 if(r==='home'||r==='')html=vHome();
 else if(r==='shop')html=vShop();
 else if(r==='product'){if(h[1]&&pdp.id!==+h[1]){pdp={id:+h[1],wi:1,q:1,tab:'d'}}html=vProduct(h[1]);active='shop'}
 else if(r==='cart')html=vCart();
 else if(r==='success'){html=vSuccess(h[1]||'');active='cart'}
 else if(r==='story')html=vStory();
 else if(r==='contact')html=vContact();
 else html=vHome();
 $('#app').innerHTML=html;
 document.querySelectorAll('[data-r]').forEach(a=>a.classList.toggle('on',a.dataset.r===(active==='home'||active===''?'home':active)));
 bind(r);updateBadge();
}
function bind(r){
 document.querySelectorAll('[data-q]').forEach(b=>b.onclick=e=>{e.preventDefault();e.stopPropagation();addCart(+b.dataset.q,1,1)});
 if(r==='shop'){
  document.querySelectorAll('[data-ty]').forEach(b=>b.onclick=()=>{shopType=b.dataset.ty;keepScroll(route)});
  const s=$('#sortSel');s.value=shopSort;s.onchange=()=>{shopSort=s.value;keepScroll(route)};
 }
 if(r==='product'){
  const t=find(pdp.id);
  const upd=()=>{const p=tk(price(t,W[pdp.wi])*pdp.q);$('#pdpPrice').textContent=p;$('#bbP').textContent=p;$('#qv').textContent=pdp.q;
   document.querySelectorAll('#wts button').forEach(b=>b.classList.toggle('on',+b.dataset.w===pdp.wi))};
  document.querySelectorAll('#wts button').forEach(b=>b.onclick=()=>{pdp.wi=+b.dataset.w;upd()});
  $('#qm').onclick=()=>{pdp.q=Math.max(1,pdp.q-1);upd()};$('#qp').onclick=()=>{pdp.q=Math.min(20,pdp.q+1);upd()};
  const add=()=>addCart(t.id,pdp.wi,pdp.q);
  $('#addBtn').onclick=add;$('#addBtn2').onclick=add;
  $('#buyBtn').onclick=()=>{add();location.hash='#/cart'};
  document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{pdp.tab=b.dataset.tab;keepScroll(route)});
 }
 if(r==='cart'&&cart.length){
  document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{const c=cart[+b.dataset.i];c.q+=+b.dataset.d;if(c.q<1)cart.splice(+b.dataset.i,1);save();keepScroll(route)});
  document.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{cart.splice(+b.dataset.rm,1);save();keepScroll(route)});
  document.querySelectorAll('#pay button').forEach(b=>b.onclick=()=>{
   pm=b.dataset.m;document.querySelectorAll('#pay button').forEach(x=>x.classList.toggle('on',x===b));
   const m=pm!=='cod';$('#trxBox').style.display=m?'block':'none';$('#fs').required=m;$('#ft').required=m});
  const m=pm!=='cod';$('#fs').required=m;$('#ft').required=m;
  $('#form').onsubmit=e=>{e.preventDefault();
   if(!cart.length){toast(T('err_cart'));return}
   const tt=totals(),id='TOT-'+String(Date.now()).slice(-6);
   try{localStorage.setItem('tot_last',JSON.stringify({id,tot:tt.tot,items:cart.map(c=>`${find(c.id).n[lang]} · ${W[c.wi].l} × ${c.q}`)}))}catch(e){}
   cart=[];save();location.hash='#/success/'+id};
 }
 if(r==='contact')$('#cform').onsubmit=e=>{e.preventDefault();toast(T('sent'));e.target.reset()};
}
function keepScroll(fn){const y=scrollY;fn();scrollTo(0,y)}
function addCart(id,wi,q){
 const e=cart.find(c=>c.id===id&&c.wi===wi);if(e)e.q=Math.min(50,e.q+q);else cart.push({id,wi,q});
 save();updateBadge();toast(T('added'));
}
function updateBadge(){
 const n=cart.reduce((a,c)=>a+c.q,0);
 ['#badgeTop','#badgeTab'].forEach(s=>{const b=$(s);b.textContent=n;b.style.display=n?'grid':'none'});
}
function toast(m){const e=$('#toast');e.textContent=m;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),1800)}
function applyLang(){
 document.documentElement.lang=lang;$('#langBtn').textContent=lang==='bn'?'EN':'বাংলা';
 document.querySelectorAll('[data-i]').forEach(el=>{el.textContent=T(el.dataset.i)});
}
$('#langBtn').onclick=()=>{lang=lang==='bn'?'en':'bn';applyLang();keepScroll(route)};
addEventListener('hashchange',()=>{route();scrollTo(0,0)});
applyLang();route();
</script>
</body>
</html>
